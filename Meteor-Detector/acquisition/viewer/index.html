<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Remote Radio Observatory Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.32.0/plotly.min.js"
        integrity="sha384-7TVmlZWH60iKX5Uk7lSvQhjtcgw2tkFjuwLcXoRSR4zXTyWFJRm9aPAguMh7CIra"
        crossorigin="anonymous"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0;
         background: #0e1116; color: #dde3ea; }
  header { padding: 12px 18px; background: #161b22; border-bottom: 1px solid #2a323c;
           display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: #9ecbff; }
  .meta { font-size: 12px; color: #8b96a3; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
           border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  button:hover { background: #30363d; }
  button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #chart { width: 100%; height: 74vh; }
  .panel { padding: 10px 18px; display: flex; gap: 24px; align-items: center;
           flex-wrap: wrap; border-top: 1px solid #2a323c; font-size: 12px; }
  .panel label { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  input[type=range] { width: 220px; }
  .stat { color: #8b96a3; }
  .stat b { color: #dde3ea; }
  #status { padding: 20px 18px; color: #8b96a3; font-size: 13px; }
  #status.error { color: #f47067; }
  a { color: #58a6ff; }
  .focusPanel { padding: 9px 18px; display: flex; gap: 12px; align-items: center;
                flex-wrap: wrap; border-bottom: 1px solid #2a323c; font-size: 12px; }
  .focusPanel label { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .focusPanel input, .focusPanel select { background: #21262d; color: #c9d1d9;
                border: 1px solid #30363d; border-radius: 4px; padding: 4px; font-size: 12px; }
  .focusHint { color: #8b96a3; }
  .downloadButton { background: #21262d; border: 1px solid #30363d; border-radius: 6px;
                    padding: 5px 11px; text-decoration: none; font-size: 12px; }
  .downloadButton:hover { background: #30363d; }
  #filesPanel { border-top: 1px solid #2a323c; padding: 12px 18px 24px; }
  #filesPanel h2 { font-size: 13px; font-weight: 600; color: #9ecbff; margin: 0 0 8px; }
  #fileList { max-height: 260px; overflow: auto; font-size: 12px; }
  .fileRow { display: grid; grid-template-columns: 170px 55px minmax(180px, 1fr) 70px; gap: 10px;
             padding: 4px 0; border-bottom: 1px solid #1d232b; align-items: center; }
  .fileRow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fileNote { color: #8b96a3; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>Remote Radio Observatory</h1>
  <span class="meta" id="metaLine">loading…</span>
  <div class="controls">
    <button data-range="1">last 1h</button>
    <button data-range="6">last 6h</button>
    <button data-range="24" class="active">last 24h</button>
    <button data-range="168">last 7d</button>
    <button data-range="all">all</button>
    <button id="btnRefresh">refresh</button>
  </div>
</header>

<div class="focusPanel">
  <span class="focusHint">focus a UTC window:</span>
  <label>day <input type="date" id="focusDay"></label>
  <label>start hour
    <select id="focusHour"></select>
  </label>
  <label>window
    <select id="focusWindow">
      <option value="1">1 hour</option>
      <option value="6">6 hours</option>
      <option value="24">24 hours</option>
    </select>
  </label>
  <button id="btnFocus">plot selection</button>
  <a id="downloadRange" class="downloadButton" hidden download>download selected NPZ chunks</a>
</div>

<div id="status">loading…</div>
<div id="chart" style="display:none"></div>

<div class="panel" id="panel" style="display:none">
  <label>
    candidate threshold (SNR dB)
    <input type="range" id="threshold" min="-5" max="40" step="0.5" value="6">
    <b id="threshVal">6.0</b> dB
  </label>
  <span class="stat">recorder triggers in view: <b id="statTrig">–</b></span>
  <span class="stat">candidates at this threshold: <b id="statCand">–</b></span>
  <span class="stat">points shown: <b id="statPoints">–</b></span>
  <span class="stat" id="approxNote"></span>
</div>

<section id="filesPanel">
  <h2>completed recordings</h2>
  <div class="fileNote" id="fileNote">loading file list…</div>
  <div id="fileList"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
let currentRangeHours = 24;
let lastPayload = null;
let summaryData = null;
let focusInitialized = false;
let rangeRequest = 0;
let rangeTimer = null;

function fmtNs(ns) {
  return new Date(ns / 1e6).toISOString().replace('T', ' ').replace('Z', ' UTC');
}

async function loadSummary() {
  const r = await fetch('/api/summary');
  const s = await r.json();
  if (!s.count) {
    $('status').className = 'error';
    $('status').textContent =
      'No .npz chunks found in ' + (s.dir || 'the configured directory') + '. ' +
      'Run fm_observe.py to record, or try demo_data.py for a synthetic dataset ' +
      '(python3 demo_data.py --hours 24 --out ~/demo_observations, then restart ' +
      'server.py --dir ~/demo_observations).';
    return null;
  }
  $('metaLine').textContent =
    s.stations.join(', ') + '  ·  ' + s.count + ' chunk file(s)  ·  ' +
    fmtNs(s.start_ns) + '  →  ' + fmtNs(s.end_ns) + '  ·  ' + s.dir;
  summaryData = s;
  return s;
}

async function loadRange(hours, summaryData) {
  const endNs = summaryData.end_ns;
  const startNs = hours === 'all' ? summaryData.start_ns
                                   : endNs - hours * 3600 * 1e9;
  await loadData(startNs, endNs, true);
}

async function loadData(startNs, endNs, clearChart, maxPoints = 3000) {
  const requestId = ++rangeRequest;
  $('status').className = '';
  $('status').textContent = 'loading…';
  if (clearChart) {
    $('chart').style.display = 'none';
    $('panel').style.display = 'none';
  }
  const url = `/api/data?start_ns=${Math.round(startNs)}&end_ns=${Math.round(endNs)}&max_points=${maxPoints}`;
  const r = await fetch(url);
  const d = await r.json();
  if (requestId !== rangeRequest) return;
  if (d.error) {
    $('downloadRange').hidden = true;
    $('status').className = 'error';
    $('status').textContent = 'Error: ' + d.error;
    return;
  }
  lastPayload = d;
  $('downloadRange').href = `/download-range?start_ns=${Math.round(startNs)}&end_ns=${Math.round(endNs)}`;
  $('downloadRange').textContent = `download selected NPZ chunks (${d.files_used})`;
  $('downloadRange').hidden = false;
  render(d);
}

function datePart(date) {
  return date.toISOString().slice(0, 10);
}

function configureFocus(s) {
  const day = $('focusDay');
  const hour = $('focusHour');
  const last = new Date(s.end_ns / 1e6);
  const earliest = new Date(s.start_ns / 1e6);
  day.min = datePart(earliest);
  day.max = datePart(last);
  if (!focusInitialized) {
    const oneHourEarlier = new Date(last.getTime() - 3600 * 1000);
    day.value = datePart(oneHourEarlier);
    hour.value = String(oneHourEarlier.getUTCHours()).padStart(2, '0');
  }
  if (!hour.options.length) {
    for (let i = 0; i < 24; i++) {
      const option = document.createElement('option');
      option.value = String(i).padStart(2, '0');
      option.textContent = `${option.value}:00 UTC`;
      hour.append(option);
    }
    if (!focusInitialized) {
      const oneHourEarlier = new Date(last.getTime() - 3600 * 1000);
      hour.value = String(oneHourEarlier.getUTCHours()).padStart(2, '0');
    }
  }
  focusInitialized = true;
}

async function plotFocusSelection() {
  if (!summaryData || !$('focusDay').value) return;
  const [year, month, day] = $('focusDay').value.split('-').map(Number);
  const startMs = Date.UTC(year, month - 1, day, Number($('focusHour').value));
  const hours = Number($('focusWindow').value);
  const endMs = startMs + hours * 3600 * 1000;
  document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
  await loadData(startMs * 1e6, endMs * 1e6, true, 10000);
}

function render(d) {
  const t = d.t_utc_ns.map(ns => new Date(ns / 1e6));
  const meta = d.meta || {};

  const powerBand = {
    x: t.concat(t.slice().reverse()),
    y: d.power_max.concat(d.power_min.slice().reverse()),
    fill: 'toself', fillcolor: 'rgba(88,166,255,0.15)',
    line: { color: 'transparent' }, showlegend: false, hoverinfo: 'skip',
    xaxis: 'x', yaxis: 'y1', type: 'scatter'
  };
  const powerMax = {
    x: t, y: d.power_max, name: 'power (max)', line: { color: '#58a6ff', width: 1 },
    xaxis: 'x', yaxis: 'y1', type: 'scatter'
  };
  const noiseLine = {
    x: t, y: d.noise_max, name: 'noise floor', line: { color: '#3fb950', width: 1 },
    xaxis: 'x', yaxis: 'y1', type: 'scatter'
  };
  const trigT = t.filter((_, i) => d.trigger[i]);
  const trigY = d.power_max.filter((_, i) => d.trigger[i]);
  const trigMarks = {
    x: trigT, y: trigY, name: 'recorder trigger', mode: 'markers',
    marker: { color: '#f85149', size: 6 }, xaxis: 'x', yaxis: 'y1', type: 'scatter'
  };
  const snrLine = {
    x: t, y: d.snr_max, name: 'SNR (max)', line: { color: '#d29922', width: 1 },
    xaxis: 'x2', yaxis: 'y2', type: 'scatter'
  };

  const layout = {
    grid: { rows: 2, columns: 1, pattern: 'independent', roworder: 'top to bottom' },
    height: null,
    margin: { t: 30, r: 20, l: 55, b: 40 },
    paper_bgcolor: '#0e1116', plot_bgcolor: '#161b22',
    font: { color: '#c9d1d9', size: 11 },
    xaxis: { domain: [0, 1], anchor: 'y1', matches: 'x2', showticklabels: false,
             gridcolor: '#21262d' },
    xaxis2: { domain: [0, 1], anchor: 'y2', title: 'Time (UTC)', gridcolor: '#21262d' },
    yaxis: { domain: [0.55, 1], title: 'dBFS', gridcolor: '#21262d' },
    yaxis2: { domain: [0, 0.42], title: 'SNR (dB)', gridcolor: '#21262d' },
    legend: { orientation: 'h', y: 1.08 },
    shapes: [thresholdLine(parseFloat($('threshold').value))]
  };

  Plotly.newPlot('chart', [powerBand, powerMax, noiseLine, trigMarks, snrLine],
                 layout, { responsive: true, displaylogo: false }).then(() => {
    const chart = $('chart');
    if (!chart._rroRelayoutHandler) {
      chart._rroRelayoutHandler = (ev) => {
        // Plotly reports either xaxis or xaxis2 depending on which linked
        // panel was dragged. Reloading here is what turns a visual zoom into
        // an actual request for the original 125-Hz samples.
        const lo = ev['xaxis.range[0]'] || ev['xaxis2.range[0]'];
        const hi = ev['xaxis.range[1]'] || ev['xaxis2.range[1]'];
        if (!lo || !hi) return;
        const start = Date.parse(lo) * 1e6;
        const end = Date.parse(hi) * 1e6;
        if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return;
        clearTimeout(rangeTimer);
        rangeTimer = setTimeout(() => loadData(start, end, false), 180);
      };
      chart.on('plotly_relayout', chart._rroRelayoutHandler);
    }
  });

  $('chart').style.display = 'block';
  $('panel').style.display = 'flex';
  $('status').textContent = '';

  const stationTxt = meta.station ? `station ${meta.station}` : '';
  const freqTxt = meta.center_freq_hz ? (meta.center_freq_hz / 1e6).toFixed(3) + ' MHz' : '';
  $('approxNote').textContent = d.raw
    ? `full resolution (${d.raw_points} samples, ${d.files_used} file(s)) · ${stationTxt} ${freqTxt}`
    : `downsampled to ${d.t_utc_ns.length} buckets from ${d.raw_points.toLocaleString()} samples ` +
      `(min/max per bucket — a bucket flagged "candidate" had SOME sample over ` +
      `threshold, not every sample) · ${d.files_used} file(s) · ${stationTxt} ${freqTxt}`;

  updateThresholdStats();
}

function fmtBytes(n) {
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KiB`;
  return `${(n / 1024 / 1024).toFixed(1)} MiB`;
}

async function loadFiles() {
  try {
    const r = await fetch('/api/files?limit=400');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $('fileNote').textContent = `${d.total} indexed completed file(s)` +
      (d.total > d.files.length ? ` · showing newest ${d.files.length}` : '');
    const list = $('fileList');
    list.textContent = '';
    for (const f of d.files) {
      const row = document.createElement('div');
      row.className = 'fileRow';
      const date = document.createElement('span');
      date.textContent = fmtNs(f.start_ns);
      const kind = document.createElement('span');
      kind.textContent = f.type.toUpperCase();
      const name = document.createElement('span');
      name.className = 'name';
      name.title = f.name;
      name.textContent = f.name;
      const link = document.createElement('a');
      link.href = f.download_url;
      link.download = f.name;
      link.textContent = `download (${fmtBytes(f.size)})`;
      row.append(date, kind, name, link);
      list.append(row);
    }
  } catch (e) {
    $('fileNote').textContent = 'File list unavailable: ' + e.message;
  }
}

function thresholdLine(val) {
  return { type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y2',
           y0: val, y1: val, line: { color: '#f85149', width: 1, dash: 'dot' } };
}

function updateThresholdStats() {
  if (!lastPayload) return;
  const thresh = parseFloat($('threshold').value);
  $('threshVal').textContent = thresh.toFixed(1);

  const d = lastPayload;
  let nTrig = 0, nCand = 0;
  for (let i = 0; i < d.trigger.length; i++) {
    if (d.trigger[i]) nTrig++;
    if (d.snr_max[i] >= thresh) nCand++;
  }
  $('statTrig').textContent = nTrig;
  $('statCand').textContent = nCand;
  $('statPoints').textContent = d.t_utc_ns.length + (d.raw ? ' (raw)' : ' (buckets)');

  Plotly.relayout('chart', { 'shapes[0]': thresholdLine(thresh) });

  // Recolour candidate markers on the SNR trace without a full redraw.
  const colors = d.snr_max.map(v => v >= thresh ? '#f85149' : '#d29922');
  Plotly.restyle('chart', { 'marker.color': [colors] }, [4]);
}

$('threshold').addEventListener('input', updateThresholdStats);
$('btnRefresh').addEventListener('click', () => init());
$('btnFocus').addEventListener('click', plotFocusSelection);

document.querySelectorAll('[data-range]').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRangeHours = btn.dataset.range === 'all' ? 'all' : parseFloat(btn.dataset.range);
    const s = await loadSummary();
    if (s) await loadRange(currentRangeHours, s);
  });
});

async function init() {
  const s = await loadSummary();
  if (s) {
    configureFocus(s);
    await loadRange(currentRangeHours, s);
  }
  await loadFiles();
}
init();
</script>
</body>
</html>
